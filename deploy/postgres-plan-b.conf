# Plan B Postgres tuning — VM.Standard.E2.1.Micro (1 OCPU / 1GB RAM)
#
# Not auto-loaded by the postgres:16-alpine image (its entrypoint does not
# parse arbitrary mounted .conf files). This file is the single documented
# source of truth for the three values below and their rationale. A human
# operator copies them into a docker-compose.override.yml `command:` line
# as shown in deploy/vm-provisioning-runbook.md — this file is not parsed
# by any script.
#
# Only used on Plan B. Plan A (Ampere A1, 12GB RAM) runs the image's
# unmodified defaults — no override needed.

# Default is 128MB (postgres:16-alpine image default). On a 1GB-RAM host
# shared with the OS, Docker daemon, Uvicorn, and the in-memory ML artifact,
# 128MB of shared buffers is too large a single reservation. 64MB keeps
# Postgres functional for ~200 synthetic students/1 school year while
# leaving headroom for the rest of the stack.
shared_buffers = 64MB

# Default is 4MB. Kept at the default explicitly (not reduced further) —
# this workload has no complex sort/hash-heavy queries, and lowering it
# further risks excessive temp-file spilling for the trajectory/change
# queries. Listed here so the full Plan B profile is documented in one
# place, not because it differs from the image default.
work_mem = 4MB

# Default is 100. The system has a single Uvicorn worker (fixed by
# spec-6-1, required because the ML inference artifact is an in-memory
# singleton) plus occasional manual `psql`/`pg_dump` sessions — 20
# connections is generous headroom without reserving memory per
# connection slot that this 1GB host cannot spare.
max_connections = 20
