[project]
name = "sinaliza-backend"
version = "0.1.0"
description = "Sinaliza backend — Epic 1 vertical slice (authentication, attendance, grades, assignments, pedagogical observations)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "sqlalchemy>=2,<3",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "bcrypt==5.0.0",
  "pyjwt==2.15.0",
  "pytest==9.1.1",
  "httpx==0.28.1",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "ruff==0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
  # UP042 troca `class X(str, Enum)` por `StrEnum`, o que muda o resultado de
  # `str(X.MEMBRO)` (passa a devolver o valor). Esses enums são persistidos via
  # SQLAlchemy Enum e serializados nas respostas da API, então a troca não é
  # mecânica e fica fora deste PR de lint.
  "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# `Depends`/`Query`/`Path` em argumentos default é o idioma de injeção do
# FastAPI, não o bug que B008 procura.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# `backend/alembic/` é um diretório local, então o isort classificaria o
# pacote `alembic` como first-party; ele é dependência externa.
known-third-party = ["alembic"]
