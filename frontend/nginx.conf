# spec-6-1 (RNF-06): serve the static React build, falling back to
# index.html for client-side routes, and reverse-proxy /api/* to the
# backend service — mirroring vite.config.ts's dev-time proxy rewrite
# (strips the /api prefix) so the frontend never needs CORS configuration
# in either environment.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
