# spec-6-1 (RNF-06): serve the static React build, falling back to
# index.html for client-side routes, and reverse-proxy /api/* to the
# backend service — mirroring vite.config.ts's dev-time proxy rewrite
# (strips the /api prefix) so the frontend never needs CORS configuration
# in either environment.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Esconde a versão do Nginx do cabeçalho `Server` e das páginas de erro:
    # não é defesa, é não entregar de graça a versão exata a quem procura um
    # CVE conhecido.
    server_tokens off;

    # Cabeçalhos de resposta. Valem para tudo que sai por este server, o
    # SPA e o /api/ proxiado, porque nenhum `location` abaixo declara
    # `add_header` próprio (se algum declarar, precisa repetir estes).
    # `always` para que valham também em 4xx/5xx.
    #
    # Deliberadamente curto. Cada um fecha um ataque concreto nesta
    # aplicação; o que não fecha nada aqui ficou de fora (ver abaixo).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # CSP parcial, de propósito. As diretivas abaixo são verificáveis e não
    # têm como quebrar esta aplicação: ela não usa <iframe>, <base>,
    # <object>/<embed>, e seus <form> não fazem submit nativo.
    #
    # `script-src`/`style-src` NÃO estão aqui: `index.html` traz um <script>
    # inline (bootstrap de tema) e o React aplica estilos inline, então a
    # única CSP que subiria sem quebrar a tela seria
    # `script-src 'self' 'unsafe-inline'` — que não impede XSS nenhum e
    # serviria só para a aplicação parecer protegida (AGENTS.md: "não
    # implementar security theater"). A alternativa honesta é hash do script
    # inline, que amarra este arquivo aos bytes exatos de outro e quebra a
    # tela em branco quando alguém editar o bootstrap. Fechar isso de
    # verdade é mover o bootstrap de tema para um arquivo .js — mudança em
    # frontend/, fora do escopo deste PR.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
