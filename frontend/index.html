<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..700&display=swap"
    />
    <title>Sinaliza</title>
    <script>
      // Applies the stored theme preference before first paint — mirrored in
      // `src/theme/useTheme.ts` (same storage key/logic) so a later
      // in-app toggle stays consistent with this bootstrap.
      (function () {
        try {
          var preference = localStorage.getItem('sinaliza.theme')
          if (preference === 'light' || preference === 'dark') {
            document.documentElement.setAttribute('data-theme', preference)
          }
        } catch (_err) {
          // Storage unavailable (private browsing, disabled) — falls back to
          // the OS preference via `prefers-color-scheme`, same as always.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
