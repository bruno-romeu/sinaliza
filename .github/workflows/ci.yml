# Gate automatizado de regressão: roda as duas suítes em todo PR e em todo
# push para master. Existe para que "nada parou de funcionar" seja uma
# verificação, e não uma promessa — e para fechar o item de retro da epic 3
# (merge-before-done gate), aberto desde 2026-10-13.
#
# `backend/openapi.json` e `frontend/src/api/schema.d.ts` são gerados, não
# versionados (.gitignore). O job `backend` exporta o OpenAPI do app real e
# o publica como artifact; o job `frontend` o consome e regenera os tipos.
# Com isso o CI também detecta drift de contrato entre API e frontend: se um
# router mudar sem o frontend acompanhar, o `tsc` quebra aqui.

name: CI

on:
  pull_request:
  push:
    branches: [master]

# Um PR que recebe vários pushes seguidos cancela as execuções anteriores em
# vez de enfileirá-las.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sinaliza
          POSTGRES_PASSWORD: sinaliza
          POSTGRES_DB: sinaliza_test
        # 5433 no host espelha backend/.env.example, então o mesmo
        # TEST_DATABASE_URL vale no CI e na máquina do desenvolvedor.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sinaliza"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://sinaliza:sinaliza@localhost:5433/sinaliza_test
      DATABASE_URL: postgresql+psycopg://sinaliza:sinaliza@localhost:5433/sinaliza_test
      JWT_SECRET: ci-only-secret-do-not-use-in-prod
      # Exigido por tests/test_synthetic_{generation,facts_generation,observations}.py,
      # que resolvem o usuario autor das observacoes via get_settings().dev_seed_email
      # e falham explicitamente se ele nao existir. Localmente vem de backend/.env,
      # que e gitignored — por isso precisa ser declarado aqui. Identidade ficticia,
      # mesmo valor de backend/.env.example (AGENTS.md: nunca dado real).
      DEV_SEED_EMAIL: coordenacao@sinaliza.dev

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --frozen falha se uv.lock estiver dessincronizado do pyproject.toml,
      # em vez de resolver dependências diferentes das que a imagem usa.
      - name: Instalar dependências
        run: uv sync --frozen

      # Lint antes dos testes: uma violacao de formatacao nao deve custar os
      # ~2min30 do pytest para aparecer.
      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

      - name: Exportar OpenAPI
        run: uv run python -m app.export_openapi

      - name: Publicar OpenAPI para o job de frontend
        uses: actions/upload-artifact@v5
        with:
          name: openapi
          path: backend/openapi.json
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    # Depende do backend porque consome o openapi.json que ele exporta.
    needs: backend

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Baixar OpenAPI do job de backend
        uses: actions/download-artifact@v6
        with:
          name: openapi
          path: backend

      # `npm ci` (e não `install`) para respeitar o package-lock.json.
      - name: Instalar dependências
        run: npm ci

      - name: Gerar tipos da API
        run: npm run generate:api-types

      # `npm run lint` falha so em erro; os 45 avisos atuais (regras do
      # React Compiler sobre workarounds deliberados nas telas de lancamento,
      # mais estilo de teste) ficam visiveis no log sem bloquear o PR. Fechar
      # esses avisos e trabalho de um PR dedicado.
      - name: ESLint
        run: npm run lint

      # O .gitattributes do repo forca eol=lf, entao o checkout do runner
      # sempre tem LF e o endOfLine do Prettier bate. Num clone Windows com
      # core.autocrlf=true este check pode dar falso positivo localmente.
      - name: Prettier
        run: npm run format:check

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vitest
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Depende do job de frontend: nao faz sentido pagar o build das imagens se
    # o tsc ou o vitest ja reprovaram.
    needs: frontend

    steps:
      - uses: actions/checkout@v5

      # O docker-compose.yml exige JWT_SECRET (`:?` falha sem ele) e le este
      # arquivo do diretorio do projeto. As DEV_SEED_* alimentam o comando de
      # seed abaixo. Identidade ficticia, igual a backend/.env.example — o
      # AGENTS.md proibe dado real em qualquer ambiente.
      - name: Criar .env para o docker compose
        run: |
          cat > .env <<'ENVFILE'
          JWT_SECRET=ci-only-secret-do-not-use-in-prod
          DEV_SEED_NAME=Coordenacao Pedagogica
          DEV_SEED_EMAIL=coordenacao@sinaliza.dev
          DEV_SEED_PASSWORD=change-me
          ENVFILE

      # As imagens se bastam a partir de um clone limpo: o Dockerfile do
      # frontend gera openapi.json e schema.d.ts em estagios proprios.
      - name: Subir a stack
        run: docker compose up -d --build

      # Esperar o Nginx responder NAO basta: ele serve os estaticos assim que
      # sobe, enquanto o backend ainda roda `alembic upgrade head`. A primeira
      # versao disto semeava o usuario cedo demais e morria com
      # `relation "users" does not exist`.
      #
      # Sondar o backend resolve, porque docker-entrypoint.sh faz
      # `set -e; alembic upgrade head; exec uvicorn` — se ele responde HTTP, a
      # migration ja terminou com sucesso. A requisicao passa pelo Nginx, entao
      # tambem prova o proxy /api.
      #
      # Usa /openapi.json de proposito, NAO /auth/login: o login e limitado por
      # taxa, e um loop de sondagem queimaria a cota antes do smoke test rodar.
      - name: Esperar o backend responder
        run: timeout 180 bash -c 'until curl -sf http://localhost/api/openapi.json > /dev/null; do sleep 2; done'

      # Banco recem-criado nao tem usuario. Sem isto o smoke test de login
      # falha por ausencia de dado, nao por defeito da aplicacao.
      - name: Semear o usuario de desenvolvimento
        run: docker compose exec -T backend python -m app.infrastructure.db.seed_dev_user

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      # `--with-deps` instala as bibliotecas de sistema que o Chromium precisa
      # no runner Ubuntu. So Chromium: isto e um smoke test de stack viva, nao
      # uma matriz de compatibilidade entre navegadores.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Playwright
        run: npm run test:e2e
        working-directory: frontend

      # Em falha, o que explica a causa: o relatorio com trace/screenshot e os
      # logs dos tres servicos.
      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Logs dos serviços
        if: failure()
        run: docker compose logs --no-color --tail 200
